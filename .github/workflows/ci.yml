name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lessonforge_user
          POSTGRES_PASSWORD: lessonforge_dummy_password
          POSTGRES_DB: lessonforge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lessonforge_user -d lessonforge_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://lessonforge_user:lessonforge_dummy_password@127.0.0.1:5432/lessonforge_db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (Python from .python-version)
        run: uv sync --locked

      - name: Lint, format and type check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app

      - name: Check migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run backend tests
        run: uv run pytest

  frontend-checks:
    name: Frontend Typecheck and Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Build images
        run: docker compose -f infra/docker-compose.yml build
