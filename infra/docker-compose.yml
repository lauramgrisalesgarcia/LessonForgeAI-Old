# Entorno de desarrollo local. Ejecutar desde la raíz del repositorio:
#   docker compose -f infra/docker-compose.yml up --build
# Las rutas son relativas a este directorio (infra/). Credenciales ficticias de desarrollo.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lessonforge_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lessonforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lessonforge_dummy_password}
      POSTGRES_DB: ${POSTGRES_DB:-lessonforge_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: lessonforge_backend
    restart: unless-stopped
    # Aplica las migraciones y arranca la API con recarga en caliente
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lessonforge_user}:${POSTGRES_PASSWORD:-lessonforge_dummy_password}@db:5432/${POSTGRES_DB:-lessonforge_db}
      DOCS_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/Dockerfile.frontend
    container_name: lessonforge_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  # PostgreSQL 16 + pgvector (imagen Debian; no reutiliza el volumen anterior de la imagen alpine)
  pgvector_data:
